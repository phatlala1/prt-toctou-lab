name: R84 NuGet provider path-case binding

on:
  push:
    branches:
      - r84-nuget-provider-path-case
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-provider-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out R84 laboratory
        uses: actions/checkout@v4
        with:
          path: lab

      - name: Check out current shipping NuGetAuthenticate source
        uses: actions/checkout@v4
        with:
          repository: microsoft/azure-pipelines-tasks
          ref: 10bf9e6f624e93c9a91dbd2034545d6fcf0b8c64
          path: product
          sparse-checkout: |
            Tasks/NuGetAuthenticateV1/main.ts
            Tasks/NuGetAuthenticateV1/make.json
            Tasks/NuGetAuthenticateV1/task.json
          sparse-checkout-cone-mode: false

      - name: Install stable .NET 6 and .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Execute released-provider matrix
        id: runtime
        continue-on-error: true
        shell: bash
        run: bash ./lab/r84-nuget-provider-path-case/run.sh

      - name: Rebuild complete evidence hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | sed 's#  evidence/#  #' \
            > evidence/SHA256SUMS.txt

      - name: Upload R84 runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r84-nuget-provider-path-case-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Surface fail-closed verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/result.json
          status=$(python3 -c 'import json; print(json.load(open("evidence/result.json"))["status"])')
          cat evidence/result.json
          case "$status" in
            SUPPORTED_RELEASE_RUNTIME_POSITIVE_REVIEW_REQUIRED)
              echo 'R84 runtime positive. Duplicate, deployment-boundary, and MSRC scope review remain mandatory.' >&2
              exit 10
              ;;
            RUNTIME_NEGATIVE_CLOSED)
              exit 0
              ;;
            *)
              echo "R84 invalid runtime: $status" >&2
              exit 2
              ;;
          esac
