name: R65 ASP.NET Core passkey replay

on:
  push:
    branches: [main]
    paths:
      - "r65-passkey-replay/**"
      - ".github/workflows/r65-passkey-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4

      - name: Install stock .NET 11 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Capture runtime identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet --info | tee evidence/dotnet-info.txt
          dotnet --list-runtimes | tee evidence/dotnet-runtimes.txt
          dotnet --list-sdks | tee evidence/dotnet-sdks.txt
          git rev-parse HEAD | tee evidence/source-commit.txt
          uname -a | tee evidence/runner-uname.txt

      - name: Build server and probe
        shell: bash
        run: |
          set -euo pipefail
          dotnet build r65-passkey-replay/Server/Server.csproj -c Release 2>&1 | tee evidence/build-server.log
          dotnet build r65-passkey-replay/Probe/Probe.csproj -c Release 2>&1 | tee evidence/build-probe.log

      - name: Run real Kestrel replay probe
        id: runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export R65_KEY_PATH="$PWD/.r65-private-key.pk8"

          dotnet run \
            --project r65-passkey-replay/Server/Server.csproj \
            -c Release \
            --no-build \
            --urls http://127.0.0.1:5265 \
            > evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          dotnet run \
            --project r65-passkey-replay/Probe/Probe.csproj \
            -c Release \
            --no-build \
            -- \
            --base http://127.0.0.1:5265 \
            --origin http://localhost:5265 \
            --key "$R65_KEY_PATH" \
            --out "$PWD/evidence/results.json" \
            2>&1 | tee evidence/probe.log

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > evidence/SHA256SUMS.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r65-passkey-replay-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30

      - name: Surface runtime verdict
        if: always()
        shell: bash
        run: |
          if [[ ! -f evidence/results.json ]]; then
            echo "R65 inconclusive: runtime evidence was not produced."
            exit 1
          fi

          verdict="$(python3 -c 'import json; print(json.load(open("evidence/results.json"))["verdict"])')"
          echo "R65 verdict: $verdict"
          if [[ "$verdict" == POSITIVE* ]]; then
            exit 1
          fi
          if [[ "$verdict" == INCONCLUSIVE* ]]; then
            exit 1
          fi
