name: R64 .NET 11 CSRF browser matrix

on:
  push:
    branches:
      - r64-dotnet11-csrf-browser-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4

      - name: Confirm workflow parser and branch contents
        shell: bash
        run: |
          set -euo pipefail
          test -f r64-dotnet11-csrf-browser-matrix/R64.csproj
          test -f r64-dotnet11-csrf-browser-matrix/browser-matrix.mjs
          echo "R64_WORKFLOW_PARSER_OK"
