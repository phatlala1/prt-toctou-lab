name: R71 Razor server cross integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out laboratory
        uses: actions/checkout@v4

      - name: Closed candidate notice
        shell: pwsh
        run: |
          Write-Host 'R71 is closed: same-desktop UAC elevation is not an MSRC serviced security boundary.'
          Write-Host 'See r71-razor-server-cross-integrity/CLOSED_R71_UAC_NON_BOUNDARY.md.'
          exit 0
