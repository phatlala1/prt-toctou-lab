name: R82 task-lib stateless marker boundary

on:
  push:
    branches: [r82-tasklib-stateless-marker]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipping-callsite-audit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: m282
            tasks_ref: releases/m282.20261030/hotfix-buildId-32410599
          - lane: m283
            tasks_ref: releases/m283.20261105/hotfix-buildId-32473345
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out R82 laboratory
        uses: actions/checkout@v4
        with:
          path: lab

      - name: Check out shipping Azure Pipelines tasks
        uses: actions/checkout@v4
        with:
          repository: microsoft/azure-pipelines-tasks
          ref: ${{ matrix.tasks_ref }}
          path: product
          fetch-depth: 1

      - name: Check out pinned task-lib implementation
        uses: actions/checkout@v4
        with:
          repository: microsoft/azure-pipelines-task-lib
          ref: 43673c958dc5fb40b898c5c7b5b7b5bf0ebd14bd
          path: tasklib
          fetch-depth: 1

      - name: Record immutable identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/${{ matrix.lane }}
          git -C product rev-parse HEAD | tee evidence/${{ matrix.lane }}/tasks-commit.txt
          git -C tasklib rev-parse HEAD | tee evidence/${{ matrix.lane }}/tasklib-commit.txt
          git -C lab rev-parse HEAD | tee evidence/${{ matrix.lane }}/lab-commit.txt
          printf '%s\n' '${{ matrix.tasks_ref }}' > evidence/${{ matrix.lane }}/tasks-ref.txt
          node --version | tee evidence/${{ matrix.lane }}/node-version.txt
          python3 --version | tee evidence/${{ matrix.lane }}/python-version.txt

      - name: Validate and run shipping call-site audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lab/r82-tasklib-stateless-marker/audit_calls.py
          python3 lab/r82-tasklib-stateless-marker/audit_calls.py \
            product/Tasks \
            --json evidence/${{ matrix.lane }}/callsite-audit.json \
            --markdown evidence/${{ matrix.lane }}/callsite-audit.md \
            | tee evidence/${{ matrix.lane }}/callsite-audit-console.log

      - name: Build pinned task-lib 5.283.3
        shell: bash
        working-directory: tasklib/node
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build 2>&1 | tee ../../evidence/${{ matrix.lane }}/tasklib-build.log
          node -p "require('./package.json').version" \
            | tee ../../evidence/${{ matrix.lane }}/tasklib-version.txt
          test -f _build/task.js
          test -f _build/externaloutput.js
          sha256sum _build/task.js _build/externaloutput.js \
            | tee ../../evidence/${{ matrix.lane }}/tasklib-js-sha256.txt

      - name: Execute task-lib differential with matched controls
        id: differential
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node lab/r82-tasklib-stateless-marker/probe.js \
            tasklib/node/_build \
            evidence/${{ matrix.lane }}/tasklib-differential.json \
            2>&1 | tee evidence/${{ matrix.lane }}/tasklib-differential-console.log
          code=${PIPESTATUS[0]}
          printf 'probeExitCode=%s\n' "$code" \
            | tee evidence/${{ matrix.lane }}/probe-exit.txt
          exit "$code"

      - name: Produce fail-closed lane verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lane = '${{ matrix.lane }}'
          root = Path('evidence') / lane
          audit_path = root / 'callsite-audit.json'
          probe_path = root / 'tasklib-differential.json'
          reasons = []

          if not audit_path.is_file() or not probe_path.is_file():
              status = 'INVALID_RUNTIME'
              reasons.append('audit or differential result missing')
              audit = json.loads(audit_path.read_text()) if audit_path.is_file() else {}
              probe = json.loads(probe_path.read_text()) if probe_path.is_file() else {}
          else:
              audit = json.loads(audit_path.read_text())
              probe = json.loads(probe_path.read_text())
              core = bool(probe.get('coreDifferentialObserved'))
              high = int(audit.get('highPriorityCalls', 0))
              if not core:
                  status = 'RUNTIME_NEGATIVE_OR_INVALID'
                  reasons.append('task-lib differential not observed')
              elif high == 0:
                  status = 'CLOSED_NO_SHIPPING_CALLSITE'
                  reasons.append('core API differential exists but no shipping raw-output call lacked explicit line termination')
              else:
                  status = 'HOLD_MANUAL_CALLSITE_REVIEW'
                  reasons.append(f'{high} high-priority source hit(s) require manual source-to-sink validation')

          result = {
              'schema': 'r82-lane-verdict/v1',
              'lane': lane,
              'tasksRef': '${{ matrix.tasks_ref }}',
              'status': status,
              'reasons': reasons,
              'coreDifferentialObserved': bool(probe.get('coreDifferentialObserved')),
              'totalCalls': audit.get('totalCalls'),
              'unterminatedCalls': audit.get('unterminatedCalls'),
              'highPriorityCalls': audit.get('highPriorityCalls'),
              'securityClaimLimit': 'No vulnerability claim without a real shipping task callsite and shipping agent command execution.',
          }
          (root / 'lane-verdict.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root=evidence/${{ matrix.lane }}
          find "$root" -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS.txt"

      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r82-${{ matrix.lane }}-evidence
          path: evidence/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 30

      - name: Surface candidate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=$(python3 -c "import json; print(json.load(open('evidence/${{ matrix.lane }}/lane-verdict.json'))['status'])")
          case "$status" in
            CLOSED_NO_SHIPPING_CALLSITE|RUNTIME_NEGATIVE_OR_INVALID)
              exit 0
              ;;
            HOLD_MANUAL_CALLSITE_REVIEW)
              echo 'R82 requires manual review; this is not a vulnerability verdict.' >&2
              exit 10
              ;;
            *)
              echo "R82 invalid lane status: $status" >&2
              exit 2
              ;;
          esac
