name: R83 task-lib versus shipping agent parser

on:
  push:
    branches: [r83-tasklib-agent-parser-differential]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out R83 laboratory
        uses: actions/checkout@v4
        with:
          path: lab

      - name: Check out pinned task-lib 5.283.3
        uses: actions/checkout@v4
        with:
          repository: microsoft/azure-pipelines-task-lib
          ref: 43673c958dc5fb40b898c5c7b5b7b5bf0ebd14bd
          path: tasklib
          fetch-depth: 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence agent
          git -C lab rev-parse HEAD | tee evidence/lab-commit.txt
          git -C tasklib rev-parse HEAD | tee evidence/tasklib-commit.txt
          dotnet --info | tee evidence/dotnet-info.txt
          node --version | tee evidence/node-version.txt
          npm --version | tee evidence/npm-version.txt

      - name: Download and verify shipping Azure Pipelines Agent v5.282.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://download.agent.dev.azure.com/agent/5.282.0/vsts-agent-linux-x64-5.282.0.tar.gz'
          curl --fail --location --retry 5 --retry-all-errors \
            "$url" --output agent-v5.282.0.tar.gz
          echo 'd7a8f9cc0241dbd2d1b26b7ee225ca518fd07e62176aa04668ef1a90a9e41188  agent-v5.282.0.tar.gz' \
            | tee evidence/agent-package-expected-sha256.txt \
            | sha256sum --check
          tar -xzf agent-v5.282.0.tar.gz -C agent
          test -f agent/bin/Microsoft.VisualStudio.Services.Agent.dll
          test -f agent/bin/Agent.Worker.dll
          sha256sum \
            agent-v5.282.0.tar.gz \
            agent/bin/Microsoft.VisualStudio.Services.Agent.dll \
            agent/bin/Agent.Worker.dll \
            | tee evidence/agent-binary-sha256.txt
          printf '%s\n' 'v5.282.0' > evidence/agent-release.txt
          printf '%s\n' '2d408e314fdb7aed11ad36871d5c08b8c52c38b9' > evidence/agent-source-commit.txt

      - name: Build pinned task-lib implementation
        shell: bash
        working-directory: tasklib/node
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build 2>&1 | tee ../../evidence/tasklib-build.log
          test -f _build/externaloutput.js
          node -p "require('./package.json').version" | tee ../../evidence/tasklib-version.txt
          sha256sum _build/externaloutput.js _build/task.js \
            | tee ../../evidence/tasklib-binary-sha256.txt

      - name: Generate deterministic sanitizer corpus
        shell: bash
        run: |
          set -euo pipefail
          node lab/r83-tasklib-agent-parser-differential/generate.js \
            tasklib/node/_build \
            evidence/cases.jsonl \
            evidence/corpus-stats.json \
            250000 \
            2>&1 | tee evidence/generator-console.log
          wc -l evidence/cases.jsonl | tee evidence/cases-line-count.txt
          sha256sum evidence/cases.jsonl | tee evidence/cases-sha256.txt

      - name: Build shipping-agent reflection harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore lab/r83-tasklib-agent-parser-differential/ParserProbe/ParserProbe.csproj
          dotnet build \
            lab/r83-tasklib-agent-parser-differential/ParserProbe/ParserProbe.csproj \
            --configuration Release --no-restore \
            2>&1 | tee evidence/harness-build.log

      - name: Execute shipping parser differential
        id: parser
        continue-on-error: true
        shell: bash
        run: |
          set +e
          dotnet run \
            --project lab/r83-tasklib-agent-parser-differential/ParserProbe/ParserProbe.csproj \
            --configuration Release --no-build -- \
            agent/bin \
            evidence/cases.jsonl \
            evidence/corpus-stats.json \
            evidence/result.json \
            2>&1 | tee evidence/parser-console.log
          code=${PIPESTATUS[0]}
          printf 'parserExitCode=%s\n' "$code" | tee evidence/parser-exit.txt
          exit "$code"

      - name: Minimize retained evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f evidence/cases.jsonl; then
            gzip -9 evidence/cases.jsonl
          fi

      - name: Hash complete evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          find evidence -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  evidence/#  #' \
            > evidence/SHA256SUMS.txt

      - name: Upload R83 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83-tasklib-agent-parser-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Surface fail-closed verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f evidence/result.json
          status=$(python3 -c "import json; print(json.load(open('evidence/result.json'))['status'])")
          case "$status" in
            RUNTIME_NEGATIVE_CLOSED)
              exit 0
              ;;
            SHIPPING_AGENT_PARSER_BYPASS_REVIEW_REQUIRED)
              echo 'R83 parser differential positive; manual impact and duplicate review required.' >&2
              exit 10
              ;;
            *)
              echo "R83 invalid status: $status" >&2
              exit 2
              ;;
          esac
